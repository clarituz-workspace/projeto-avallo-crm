name: avallo-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: avallo-postgres
    environment:
      POSTGRES_DB: Avallo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c max_connections=500
    ports:
      - "5432:5432"
    volumes:
      - avallo-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Avallo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: avallo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: avallo
      MINIO_ROOT_PASSWORD: avallo-dev-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - avallo-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: avallo-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: avallo
      MINIO_ROOT_PASSWORD: avallo-dev-key
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/uploads"
    restart: "no"

volumes:
  avallo-postgres18-data:
  avallo-minio-data:
